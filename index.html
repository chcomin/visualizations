<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizations</title>
<meta name="description" content="Interactive visualizations of research data.">
<style>
  :root { --bg: #0d0e11; --card: #17181c; --border: rgba(255, 255, 255, 0.09); --ink: #ecebe7; --ink2: #a9a7a1;
    --accent: #f08a4b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--ink2); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.card { display: block; padding: 18px 20px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); color: inherit; text-decoration: none; }
  a.card:hover { border-color: rgba(240, 138, 75, 0.6); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .title { font-weight: 600; font-size: 16px; }
  .desc { color: var(--ink2); font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Visualizations</h1>
  <p class="sub">Interactive visualizations of research data.</p>
  <ul>
    <li><a class="card" href="capillary-network-3d/">
      <div class="title">Cortical capillary network in 3D</div>
      <div class="desc">Reconstruction of the blood vessels in confocal stacks of mouse cortex (CD31), for 30 stacks
        of wild-type and heterozygous animals.</div>
    </a></li>
  </ul>
</main>
</body>
</html>
